name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: Upload to Test PyPI instead of PyPI
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Release tag: $TAG_NAME"
          echo "Tag version (normalized): $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Package version ($PACKAGE_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install build dependencies
        run: uv pip install --python ${Python_ROOT_DIR} build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: python -m twine check dist/*

      - name: Upload to Test PyPI
        if: ${{ github.event.inputs.test_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Upload to PyPI
        if: ${{ github.event.inputs.test_pypi != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv and pipx
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv pip install --python ${Python_ROOT_DIR} pipx

      - name: Wait for package availability
        run: sleep 60

      - name: Test pipx run (Test PyPI)
        if: ${{ github.event.inputs.test_pypi == 'true' }}
        run: pipx run --pip-args="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" --spec swe-sweep sweep --help

      - name: Test pipx run (PyPI)
        if: ${{ github.event.inputs.test_pypi != 'true' }}
        run: pipx run --spec swe-sweep sweep --help

      - name: Test uvx (Test PyPI)
        if: ${{ github.event.inputs.test_pypi == 'true' }}
        run: uvx --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --from swe-sweep sweep --help

      - name: Test uvx (PyPI)
        if: ${{ github.event.inputs.test_pypi != 'true' }}
        run: uvx --from swe-sweep sweep --help

      - name: Test pip install and CLI (Test PyPI)
        if: ${{ github.event.inputs.test_pypi == 'true' }}
        run: |
          uv pip install --python ${Python_ROOT_DIR} --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ swe-sweep
          sweep --help

      - name: Test pip install and CLI (PyPI)
        if: ${{ github.event.inputs.test_pypi != 'true' }}
        run: |
          uv pip install --python ${Python_ROOT_DIR} swe-sweep
          sweep --help
